name: Backend CI/CD

on:
  push:
    branches:
      - feature/full-stack
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.22'
  AWS_REGION: us-east-1
  ECR_REPOSITORY: starttech-backend
  ECR_REGISTRY: 423623832118.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/MuchToDo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/MuchToDo/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: backend/MuchToDo

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./backend/MuchToDo

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for Docker
        id: meta
        run: |
          echo "tags=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.meta.outputs.tags }} -t ${{ steps.meta.outputs.latest }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.latest }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance IDs
        id: get-instances
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=starttech-backend" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
          echo "instance-ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 instances
        run: |
          for INSTANCE_ID in ${{ steps.get-instances.outputs.instance-ids }}; do
            echo "Deploying to instance: $INSTANCE_ID"
            
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "#!/bin/bash",
                "set -e",
                "echo \"Logging into ECR...\"",
                "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
                "echo \"Pulling new image...\"",
                "docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
                "echo \"Stopping old container...\"",
                "docker stop backend || true",
                "docker rm backend || true",
                "echo \"Starting new container...\"",
                "docker run -d --name backend --restart unless-stopped -p 8080:8080 -v /home/ec2-user/.env:/root/.env --env-file /home/ec2-user/.env ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
                "echo \"Waiting for health check...\"",
                "sleep 10",
                "curl -f http://localhost:8080/health || exit 1",
                "echo \"Deployment successful!\""
              ]' \
              --output text
            
            sleep 5
          done

      - name: Verify deployment
        run: |
          echo "Waiting for ALB health checks..."
          sleep 30
          
          # Check ALB target health
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
            --names starttech-backend-tg \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text)
          
          HEALTHY_COUNT=$(aws elbv2 describe-target-health \
            --target-group-arn "$TARGET_GROUP_ARN" \
            --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
            --output text)
          
          echo "Healthy targets: $HEALTHY_COUNT"
          
          if [ "$HEALTHY_COUNT" -eq "0" ]; then
            echo "❌ No healthy targets found!"
            exit 1
          fi
          
          echo "✅ Deployment verified successfully!"

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Backend deployed successfully!"
          echo "Image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Deployment failed notification
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          exit 1
